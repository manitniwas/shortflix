<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>html,body{margin:0;height:100%;background:#000}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style></head>
<body><script>
var v=new URLSearchParams(location.search).get('v')||'';
if(/^[A-Za-z0-9_-]{6,20}$/.test(v)){
var f=document.createElement('iframe');
f.src='https://www.youtube.com/embed/'+v+'?playsinline=1&rel=0&modestbranding=1&origin='+encodeURIComponent(location.origin);
f.allow='autoplay; fullscreen; picture-in-picture; encrypted-media';f.allowFullscreen=true;
f.referrerPolicy='strict-origin-when-cross-origin';document.body.appendChild(f);}
</script></body></html>
