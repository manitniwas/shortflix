name: TestFlight

on:
  workflow_dispatch:

jobs:
  upload-testflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vite build --outDir dist --emptyOutDir
      - run: npx cap sync ios
      - name: Set up App Store Connect API key
        env:
          APPLE_ASC_PRIVATE_KEY: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$APPLE_ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Prepare signing assets (cert + profile)
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
        run: fastlane prep_signing
      - name: Bump build number
        working-directory: ios/App
        run: agvtool new-version -all ${{ github.run_number }}
      - name: Archive
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: >
          xcodebuild archive
          -project App.xcodeproj
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath build/App.xcarchive
          DEVELOPMENT_TEAM=4L24A4X49G
          -allowProvisioningUpdates
          -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          -authenticationKeyID ${ASC_KEY_ID}
          -authenticationKeyIssuerID ${ASC_ISSUER_ID}
      - name: Export IPA
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>4L24A4X49G</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.manitniwas.shortflix</key><string>PROFILE_PLACEHOLDER</string>
            </dict>
          </dict>
          </plist>
          PLIST
          PROFILE_UUID=$(basename "$(ls -t "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision | head -1)" .mobileprovision)
          echo "Using installed provisioning profile $PROFILE_UUID"
          sed -i '' "s/PROFILE_PLACEHOLDER/$PROFILE_UUID/" build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build \
            -exportOptionsPlist build/ExportOptions.plist \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID ${ASC_KEY_ID} \
            -authenticationKeyIssuerID ${ASC_ISSUER_ID}
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APPLE_ASC_PRIVATE_KEY }}
        run: fastlane beta
